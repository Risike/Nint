services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nint-api-dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-this-secret}
      - DATABASE_PATH=/data/nint.db
      - APP_BASE_URL=http://localhost:5173
      - CORS_ORIGIN=http://localhost:5173
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - nint_db_dev_data:/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nint-web-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  nint_db_dev_data:
