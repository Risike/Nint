<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background rounded card -->
  <rect width="100" height="100" rx="22" fill="#0b0f19"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!--
    "N" composed of authentic Tetris Minos (SRS standard colors and grid cells):
    Cell size: 16x16 with 2px gap (grid step = 18).
    Origin: (14, 14) -> 4 columns: x = 14, 32, 50, 68; 4 rows: y = 14, 32, 50, 68

    Left Column: 4 minos forming the vertical post (I-piece / J-piece / L-piece feel)
    - Cyan I mino at (14, 14)
    - Cyan I mino at (14, 32)
    - Blue J mino at (14, 50)
    - Blue J mino at (14, 68)

    Diagonal Bridge: 2 minos (Z-piece & Purple T feel)
    - Green S / Orange L mino at (32, 32)
    - Pink/Purple T mino at (50, 50)

    Right Column: 4 minos forming the right vertical post
    - Yellow O mino at (68, 14)
    - Yellow O mino at (68, 32)
    - Red Z mino at (68, 50)
    - Red Z mino at (68, 68)
  -->

  <!-- Helper definition for tetris mino block with standard bevel/highlights -->
  <defs>
    <!-- Cyan Mino -->
    <g id="mino-cyan">
      <rect width="16" height="16" rx="3" fill="#06b6d4"/>
      <rect x="1.5" y="1.5" width="13" height="4" rx="1.5" fill="#ffffff" opacity="0.35"/>
      <rect width="16" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
    </g>
    <!-- Blue Mino -->
    <g id="mino-blue">
      <rect width="16" height="16" rx="3" fill="#3b82f6"/>
      <rect x="1.5" y="1.5" width="13" height="4" rx="1.5" fill="#ffffff" opacity="0.35"/>
      <rect width="16" height="16" rx="3" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
    </g>
    <!-- Orange Mino -->
    <g id="mino-orange">
      <rect width="16" height="16" rx="3" fill="#f97316"/>
      <rect x="1.5" y="1.5" width="13" height="4" rx="1.5" fill="#ffffff" opacity="0.35"/>
      <rect width="16" height="16" rx="3" fill="none" stroke="#fb923c" stroke-width="0.8"/>
    </g>
    <!-- Purple Mino -->
    <g id="mino-purple">
      <rect width="16" height="16" rx="3" fill="#a855f7"/>
      <rect x="1.5" y="1.5" width="13" height="4" rx="1.5" fill="#ffffff" opacity="0.35"/>
      <rect width="16" height="16" rx="3" fill="none" stroke="#c084fc" stroke-width="0.8"/>
    </g>
    <!-- Yellow Mino -->
    <g id="mino-yellow">
      <rect width="16" height="16" rx="3" fill="#eab308"/>
      <rect x="1.5" y="1.5" width="13" height="4" rx="1.5" fill="#ffffff" opacity="0.35"/>
      <rect width="16" height="16" rx="3" fill="none" stroke="#fde047" stroke-width="0.8"/>
    </g>
    <!-- Red Mino -->
    <g id="mino-red">
      <rect width="16" height="16" rx="3" fill="#ef4444"/>
      <rect x="1.5" y="1.5" width="13" height="4" rx="1.5" fill="#ffffff" opacity="0.35"/>
      <rect width="16" height="16" rx="3" fill="none" stroke="#f87171" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Left Column (Cyan & Blue) -->
  <use href="#mino-cyan" x="15" y="15" />
  <use href="#mino-cyan" x="15" y="33" />
  <use href="#mino-blue" x="15" y="51" />
  <use href="#mino-blue" x="15" y="69" />

  <!-- Diagonal Transition (Orange & Purple) -->
  <use href="#mino-orange" x="33" y="33" />
  <use href="#mino-purple" x="51" y="51" />

  <!-- Right Column (Yellow & Red) -->
  <use href="#mino-yellow" x="69" y="15" />
  <use href="#mino-yellow" x="69" y="33" />
  <use href="#mino-red" x="69" y="51" />
  <use href="#mino-red" x="69" y="69" />
</svg>
